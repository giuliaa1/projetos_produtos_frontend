<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalhes do produto</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-expand-lg bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="/">Vitrine<span class="text-primary">+</span></a><div class="navbar-nav ms-auto"><a class="nav-link" href="/">Home</a><a class="nav-link" href="gerenciar.html">Gerenciar</a><a class="nav-link" href="/#creditos">Créditos</a></div></div></nav><main class="container py-5"><a href="/" class="text-decoration-none">← Voltar para produtos</a><div id="detalhe" class="mt-4"><p class="text-secondary">Carregando produto...</p></div></main><footer class="footer mt-5"><div class="container py-4"><h5>Créditos</h5><p class="mb-0 text-secondary">Projeto acadêmico — Giulia Lavinia Barbosa | PUC Minas</p></div></footer>
<div class="modal fade" id="modalEdicao" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="formEdicao"><div class="modal-header"><h5 class="modal-title">Editar produto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nome" required></div><div class="col-md-6"><label class="form-label">Código</label><input class="form-control" name="codigo" required></div><div class="col-md-4"><label class="form-label">Preço</label><input class="form-control" name="preco" type="number" min="0" step="0.01" required></div><div class="col-md-4"><label class="form-label">Estoque</label><input class="form-control" name="quantidadeEstoque" type="number" min="0" required></div><div class="col-md-4"><label class="form-label">Avaliação</label><input class="form-control" name="avaliacao" type="number" min="0" max="5" step="0.1" required></div><div class="col-md-6"><label class="form-label">Categoria</label><input class="form-control" name="categoria" required></div><div class="col-md-6"><label class="form-label">URL da imagem</label><input class="form-control" name="imagemUrl" type="url"></div><div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="3" required></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar alterações</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/detalhes.js"></script></body></html>
