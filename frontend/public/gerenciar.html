<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciar produtos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Vitrine<span class="text-primary">+</span></a>
    <div class="navbar-nav ms-auto"><a class="nav-link" href="/">Home</a><a class="nav-link active" href="gerenciar.html">Gerenciar</a></div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div><h1 class="h3 fw-bold mb-0">Gerenciar produtos</h1><p class="text-secondary mb-0">Cadastro, edição, exclusão e consultas filtradas.</p></div>
    <button class="btn btn-primary" id="btnNovo">+ Novo produto</button>
  </div>

  <div id="mensagem" class="alert d-none"></div>

  <!-- Resumo: GET /api/produtos/resumo (consulta agregada) -->
  <section class="row g-3 mb-4" id="resumo"></section>
  <section class="card card-body mb-4">
    <h2 class="h6 fw-bold">Produtos por categoria</h2>
    <div id="grafico" class="small"></div>
  </section>

  <!-- Filtros -->
  <form id="filtros" class="card card-body mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3"><label class="form-label">Nome contém</label><input class="form-control" name="nome"></div>
      <div class="col-md-3"><label class="form-label">Categoria</label><select class="form-select" name="categoria" id="selCategoria"><option value="">Todas</option></select></div>
      <div class="col-md-2"><label class="form-label">Preço mín.</label><input class="form-control" name="precoMin" type="number" min="0" step="0.01"></div>
      <div class="col-md-2"><label class="form-label">Preço máx.</label><input class="form-control" name="precoMax" type="number" min="0" step="0.01"></div>
      <div class="col-md-2"><label class="form-label">Avaliação mín.</label><input class="form-control" name="avaliacaoMin" type="number" min="0" max="5" step="0.1"></div>
      <div class="col-md-2"><label class="form-label">Estoque até</label><input class="form-control" name="estoqueMax" type="number" min="0"></div>
      <div class="col-md-3"><label class="form-label">Ordenar por</label>
        <select class="form-select" name="ordem">
          <option value="recentes">Mais recentes</option><option value="nome">Nome (A–Z)</option>
          <option value="menorPreco">Menor preço</option><option value="maiorPreco">Maior preço</option>
          <option value="melhorAvaliacao">Melhor avaliação</option><option value="menorEstoque">Menor estoque</option>
        </select></div>
      <div class="col-md-4 ms-auto d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-outline-secondary" id="btnLimpar">Limpar</button>
        <button class="btn btn-primary">Filtrar</button>
      </div>
    </div>
  </form>

  <!-- Busca por código: GET /api/produtos/codigo/:codigo -->
  <form id="buscaCodigo" class="input-group mb-3">
    <span class="input-group-text">Código exato</span>
    <input class="form-control" id="codigoBusca" placeholder="ex.: INF-001">
    <button class="btn btn-outline-primary">Buscar</button>
  </form>

  <div class="d-flex justify-content-between mb-2"><span class="text-secondary" id="contador"></span></div>
  <div class="table-responsive card">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>Código</th><th>Nome</th><th>Categoria</th><th class="text-end">Preço</th><th class="text-end">Estoque</th><th>Aval.</th><th class="text-end">Ações</th></tr></thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
</main>

<!-- Modal cadastro/edição -->
<div class="modal fade" id="modalForm" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <form id="formProduto">
    <div class="modal-header"><h5 class="modal-title" id="tituloModal">Novo produto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div id="erroForm" class="alert alert-danger d-none"></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nome" maxlength="120" required></div>
        <div class="col-md-6"><label class="form-label">Código</label><input class="form-control" name="codigo" maxlength="60" required></div>
        <div class="col-md-4"><label class="form-label">Preço</label><input class="form-control" name="preco" type="number" min="0" step="0.01" required></div>
        <div class="col-md-4"><label class="form-label">Estoque</label><input class="form-control" name="quantidadeEstoque" type="number" min="0" required></div>
        <div class="col-md-4"><label class="form-label">Avaliação (0 a 5)</label><input class="form-control" name="avaliacao" type="number" min="0" max="5" step="0.1" required></div>
        <div class="col-md-6"><label class="form-label">Categoria</label><input class="form-control" name="categoria" list="listaCategorias" required><datalist id="listaCategorias"></datalist></div>
        <div class="col-md-6"><label class="form-label">URL da imagem</label><input class="form-control" name="imagemUrl" type="url" placeholder="https://..."></div>
        <div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="3" maxlength="1000" required></textarea></div>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Salvar</button></div>
  </form>
</div></div></div>

<!-- Modal exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Excluir produto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">Deseja excluir <strong id="nomeExcluir"></strong>? Esta ação não pode ser desfeita.</div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger" id="confirmaExcluir">Excluir</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/gerenciar.js"></script>
</body></html>
